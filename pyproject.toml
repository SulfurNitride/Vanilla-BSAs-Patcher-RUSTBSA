[project]
name = "Vanilla-BSAs-Patcher"
version = "0.0.1"
description = "Decompresses archives for better loading time and fixes vanilla audio not playing. All configurable through a simple web UI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "blake3>=1.0.9",
    "eel>=0.18.2",
    "pyinstaller>=6.22.0",
    "pyxdelta>=0.2.3",
    "soundfile>=0.14.0",
]
