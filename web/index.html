<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Vanilla BSAs Patcher</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="icon.ico">
    <script type="text/javascript" src="/eel.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <div class="container">
        <h1>Vanilla BSAs Patcher</h1>

        <div class="card">
            <h3>Safeties</h3>
            <label class="checkbox-container">
                <input type="checkbox" id="backup_bsas" checked>
                Create backups when processing archives directly in Data
            </label>
            <label class="checkbox-container">
                <input type="checkbox" id="verify_hashes" checked>
                Verify hashes before patching (English games only, disable if non-English)
            </label>

            <br>

            <h3>Options</h3>
            <label class="checkbox-container">
                <input type="checkbox" id="decompress" checked onchange="validateOptions()">
                Decompress BSAs (recommended on SSD)
            </label>
            <label class="checkbox-container">
                <input type="checkbox" id="ogg_to_wav" checked onchange="validateOptions()">
                Convert OGG to WAV (recommended, fixes some audio not playing)
            </label>
            <label class="checkbox-container">
                <input type="checkbox" id="upgrade_vorbis" checked onchange="validateOptions()">
                Upgrade Vorbis libraries (from 1.2.0.0 to 1.3.7.0*, changelog <a href="https://gitlab.xiph.org/xiph/vorbis/-/blob/master/CHANGES" target="_blank">here</a>)
            </label>
            <span class="subtext">*Compiled with various optimizations</span>
            <label class="checkbox-container">
                <input type="checkbox" id="split_mp3" onchange="validateOptions()">
                Exclude MP3s from packing (unnecessary if <a href="https://www.nexusmods.com/newvegas/mods/66347" target="_blank">Stewie Tweaks</a> >=9.85 is installed)
            </label>
            <div class="form-group">
                <label for="archive-workers">BSAs at once:</label>
                <select id="archive-workers">
                    <option value="1">1</option>
                    <option value="2" selected>2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                </select>
            </div>
        </div>

        <div class="card">
            <h3>Paths</h3>
            <div class="form-group">
                <label for="data-path">Data folder path:</label>
                <div class="input-with-button">
                    <input type="text" id="data-path" placeholder="Path to the game's Data folder" autocomplete="off">
                    <button type="button" class="browse-btn" onclick="browseFolder('data-path')"><i class="fa-solid fa-folder"></i></button>
                </div>
            </div>

            <div class="form-group">
                <label for="custom-path">Custom output path (optional):</label>
                <div class="input-with-button">
                    <input type="text" id="custom-path" placeholder="Leave blank to patch BSAs directly in Data" autocomplete="off">
                    <button type="button" class="browse-btn" onclick="browseFolder('custom-path')"><i class="fa-solid fa-folder"></i></button>
                </div>
            </div>
        </div>

        <button id="start-btn" onclick="runProcess()"><i class="fa fa-play"></i></button>

        <div class="card">
            <div class="progress-bar-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div id="log-box" class="log-container is-placeholder">Output log will appear here...</div>
        </div>

        <div class="links-container">
            <div class="links-icons">
                <a href="https://github.com/Ungeziefi/Vanilla-BSAs-Patcher" target="_blank" title="GitHub"><i class="fa-brands fa-github"></i></a>
                <a href="https://www.paypal.me/Ungeziefi" target="_blank" title="PayPal"><i class="fa-brands fa-paypal"></i></a>
                <a href="https://www.patreon.com/moddinglinked" target="_blank" title="Patreon"><i class="fa-brands fa-patreon"></i></a>
            </div>
        </div>
    </div>

    <script>
        window.addEventListener('DOMContentLoaded', async () => {
            const path = await eel.detect_data_path()();
            if (path) {
                document.getElementById('data-path').value = path;
            }
        });

        async function browseFolder(inputId) {
            const selectedFolder = await eel.select_folder()();
            if (selectedFolder) {
                document.getElementById(inputId).value = selectedFolder;
            }
        }

        eel.expose(addLog);
        function addLog(message) {
            const logBox = document.getElementById('log-box');

            // Line break if empty
            if (!message) {
                logBox.innerHTML += `<br>`;
                logBox.scrollTop = logBox.scrollHeight;
                return;
            }

            let formattedMessage = message;
            let containerClass = '';

            // Success (whole line)
            if (/passed/i.test(message) || /success/i.test(message) || /verified/i.test(message)) {
                containerClass = 'log-success';
            } else {
                // Error and warning (just the word)
                formattedMessage = message
                    .replace(/error/gi, '<span class="log-error">$&</span>')
                    .replace(/warning/gi, '<span class="log-warning">$&</span>');
            }

            logBox.innerHTML += `<div class="${containerClass}">${formattedMessage}</div>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        eel.expose(updateProgress);
        function updateProgress(percentage) {
            document.getElementById('progress-bar').style.width = percentage + '%';
        }

        function validateOptions() {
            const decompress = document.getElementById('decompress').checked;
            const oggToWav = document.getElementById('ogg_to_wav').checked;
            const upgradeVorbis = document.getElementById('upgrade_vorbis').checked;
            const splitMp3 = document.getElementById('split_mp3').checked;
            const startBtn = document.getElementById('start-btn');

            // No options enabled, button disabled
            if (!decompress && !oggToWav && !upgradeVorbis && !splitMp3) {
                startBtn.disabled = true;
            } else {
                startBtn.disabled = false;
            }
        }

        function confirmExit(e) {
            e.preventDefault();
            e.returnValue = "";
            return "";
        }

        const btn = document.getElementById('start-btn');

        function runProcess() {
            const dataPath = document.getElementById('data-path').value.trim();
            const customPath = document.getElementById('custom-path').value.trim();

            if (!dataPath) {
                alert("Please enter a valid Data path.");
                return;
            }

            const options = {
                backup_bsas: document.getElementById('backup_bsas').checked,
                verify_hashes: document.getElementById('verify_hashes').checked,
                decompress: document.getElementById('decompress').checked,
                ogg_to_wav: document.getElementById('ogg_to_wav').checked,
                upgrade_vorbis: document.getElementById('upgrade_vorbis').checked,
                split_mp3: document.getElementById('split_mp3').checked,
                archive_workers: Number(document.getElementById('archive-workers').value)
            };

            // Disable everything while processing
            btn.disabled = true;
            btn.innerHTML = '<i class="fa fa-spinner fa-spin"></i>';
            document.getElementById('data-path').disabled = true;
            document.getElementById('custom-path').disabled = true;
            document.getElementById('archive-workers').disabled = true;
            document.querySelectorAll('.card input[type="checkbox"]').forEach(cb => cb.disabled = true);
            document.querySelectorAll('.browse-btn').forEach(b => b.disabled = true);

            window.addEventListener('beforeunload', confirmExit);

            document.getElementById('log-box').innerHTML = "";
            updateProgress(0);

            eel.start_processing(dataPath, customPath, options);
        }

        eel.expose(processFinished);
        function processFinished(success) {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa fa-repeat"></i>';

            // Restore when done
            document.getElementById('data-path').disabled = false;
            document.getElementById('custom-path').disabled = false;
            document.getElementById('archive-workers').disabled = false;
            document.querySelectorAll('.card input[type="checkbox"]').forEach(cb => cb.disabled = false);
            document.querySelectorAll('.browse-btn').forEach(b => b.disabled = false);

            // Remove warning
            window.removeEventListener('beforeunload', confirmExit);
        }
    </script>
</body>

</html>
